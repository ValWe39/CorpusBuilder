[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpusbuilder"
version = "0.1.0"
description = "Concaténation locale de corpus vectorisés (JSON + NumPy) pour un usage RAG documentaire"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.scripts]
corpus = "corpusbuilder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
